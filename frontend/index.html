<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaz Sports Bets - Edge Detection System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">🎯 YAZ SPORTS BETS</h1>
                <p class="tagline">Statistical Edge Detection System</p>
            </div>
            <div class="header-controls">
                <button id="refreshBtn" class="btn btn-primary">🔄 REFRESH</button>
                <button id="settingsBtn" class="btn btn-secondary">⚙️ SETTINGS</button>
                <button id="historyBtn" class="btn btn-secondary">📊 HISTORY</button>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-group">
                <label>Sport:</label>
                <select id="sportFilter" class="select">
                    <option value="all">All Sports</option>
                    <option value="nba">NBA</option>
                    <option value="nfl">NFL</option>
                    <option value="mlb">MLB</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Min Confidence:</label>
                <select id="confidenceFilter" class="select">
                    <option value="75">75%+</option>
                    <option value="80">80%+</option>
                    <option value="85">85%+</option>
                    <option value="90">90%+</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Edge Type:</label>
                <select id="edgeTypeFilter" class="select">
                    <option value="">All Types</option>
                    <option value="Injury Impact">Injury Impact</option>
                    <option value="Positional Mismatch">Positional Mismatch</option>
                    <option value="Usage Rate Spike">Usage Rate Spike</option>
                    <option value="Rest Advantage">Rest Advantage</option>
                </select>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <span id="lastUpdate">Last updated: Never</span>
            <span id="edgeCount">0 edges found</span>
            <span id="statusIndicator" class="status-loading">Loading...</span>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Edges List -->
            <section class="edges-section">
                <h2>TODAY'S EDGES</h2>
                <div id="edgesList" class="edges-grid">
                    <div class="loading-placeholder">
                        <p>Loading edges...</p>
                    </div>
                </div>
            </section>

            <!-- Tracking Dashboard -->
            <section class="tracking-section">
                <h2>YOUR BETTING PERFORMANCE</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Today</h3>
                        <p class="stat-value" id="todayTaken">0</p>
                        <p class="stat-label">taken</p>
                        <div class="stat-row">
                            <span class="stat-win">✅ <span id="todayWins">0</span></span>
                            <span class="stat-loss">❌ <span id="todayLosses">0</span></span>
                        </div>
                        <p class="roi" id="todayROI">ROI: 0%</p>
                    </div>

                    <div class="stat-card">
                        <h3>This Week</h3>
                        <p class="stat-value" id="weekTaken">0</p>
                        <p class="stat-label">taken</p>
                        <div class="stat-row">
                            <span class="stat-win">✅ <span id="weekWins">0</span></span>
                            <span class="stat-loss">❌ <span id="weekLosses">0</span></span>
                        </div>
                        <p class="roi" id="weekROI">ROI: 0%</p>
                    </div>

                    <div class="stat-card">
                        <h3>This Month</h3>
                        <p class="stat-value" id="monthTaken">0</p>
                        <p class="stat-label">taken</p>
                        <div class="stat-row">
                            <span class="stat-win">✅ <span id="monthWins">0</span></span>
                            <span class="stat-loss">❌ <span id="monthLosses">0</span></span>
                        </div>
                        <p class="roi" id="monthROI">ROI: 0%</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edge Card Modal (for details) -->
    <div id="edgeModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
